[metadata]
name = tcgm
version = 0.1.3
author = Chidiebere V. Christopher
description = TimeCost Gradient Machine – A financial cost-sensitive gradient boosting algorithm.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
url = https://github.com/93Chidiebere/TimeCost-Gradient-Machine
project_urls =
    Bug Tracker = https://github.com/93Chidiebere/TimeCost-Gradient-Machine/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Software Development :: Libraries :: Python Modules
    Intended Audience :: Financial and Insurance Industry
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3


[options]
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.21
    pandas>=1.5
    scikit-learn>=1.1
    joblib>=1.1
    matplotlib>=3.5

[options.package_data]
* = *.txt, *.md